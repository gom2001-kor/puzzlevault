name: Sync verified English content

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [english-content-updated]

permissions:
  contents: write

concurrency:
  group: english-content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/english/package-lock.json
      - name: Import only verified content from the public source feed
        run: node --experimental-strip-types scripts/sync-english-content.mjs --if-available
      - name: Detect a new edition
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- apps/english/src/data; then
            echo 'value=false' >> "$GITHUB_OUTPUT"
          else
            echo 'value=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install locked build dependencies
        if: steps.changed.outputs.value == 'true'
        working-directory: apps/english
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test the entire learning data set and build static guides
        if: steps.changed.outputs.value == 'true'
        working-directory: apps/english
        run: |
          npm test
          npm run build
      - name: Validate the public integration
        if: steps.changed.outputs.value == 'true'
        run: |
          node --test tests/english-integration.test.js tests/english-content-sync.test.mjs tests/english-guides.test.js
          python scripts/audit-site.py
          python scripts/package-site.py
      - name: Commit the verified edition
        if: steps.changed.outputs.value == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/english/src/data apps/english/index.html learn/english sw.js sitemap.xml index.html ko/index.html ja/index.html zh/index.html es/index.html lang/*.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update verified English learning content'
          git push origin HEAD:main
      - name: Keep the deployment archive for the hosting operator
        if: steps.changed.outputs.value == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: puzzlevault-public
          path: dist/puzzlevault-public.zip
          retention-days: 14
